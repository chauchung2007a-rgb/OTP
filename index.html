<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>My Block World</title>

<style>
*{
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#79c9ee;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
}

/* TOP BAR */
#topbar{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;
    height:52px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    pointer-events:none;
    z-index:20;
}

.topButton{
    width:48px;
    height:48px;
    border:0;
    border-radius:15px;

    background:rgba(20,30,35,.68);
    color:white;
    font-size:24px;

    box-shadow:
        0 5px 15px rgba(0,0,0,.25);

    pointer-events:auto;
}

/* CROSSHAIR */
#crosshair{
    position:fixed;
    left:50%;
    top:50%;

    width:22px;
    height:22px;

    transform:translate(-50%,-50%);

    pointer-events:none;
    z-index:15;
}

#crosshair::before,
#crosshair::after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 3px black;
}

#crosshair::before{
    width:22px;
    height:2px;
    left:0;
    top:10px;
}

#crosshair::after{
    width:2px;
    height:22px;
    left:10px;
    top:0;
}

/* MOVEMENT */
#controls{
    position:fixed;
    left:16px;
    bottom:18px;

    width:155px;
    height:155px;

    z-index:20;
}

.move{
    position:absolute;

    width:52px;
    height:52px;

    border:0;
    border-radius:17px;

    background:rgba(20,30,35,.68);
    color:white;

    font-size:23px;
    font-weight:bold;

    box-shadow:
        0 5px 14px rgba(0,0,0,.25);

    touch-action:none;
}

#up{
    left:52px;
    top:0;
}

#down{
    left:52px;
    bottom:0;
}

#left{
    left:0;
    top:52px;
}

#right{
    right:0;
    top:52px;
}

/* JUMP */
#jump{
    position:fixed;
    right:22px;
    bottom:24px;

    width:68px;
    height:68px;

    border:0;
    border-radius:50%;

    background:rgba(20,30,35,.72);
    color:white;

    font-size:28px;

    box-shadow:
        0 6px 16px rgba(0,0,0,.3);

    z-index:20;
    touch-action:none;
}

/* INVENTORY */
#inventory{
    position:fixed;

    left:50%;
    bottom:14px;

    transform:translateX(-50%);

    width:min(440px,calc(100% - 230px));
    min-width:260px;

    height:72px;

    padding:8px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;

    background:rgba(20,30,35,.70);

    border-radius:20px;

    z-index:20;

    opacity:0;
    pointer-events:none;

    transition:.2s;
}

#inventory.show{
    opacity:1;
    pointer-events:auto;
}

.slot{
    flex:1;
    max-width:58px;
    height:56px;

    border:2px solid rgba(255,255,255,.2);
    border-radius:12px;

    background:rgba(255,255,255,.10);

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;

    cursor:pointer;
}

.slot.selected{
    border-color:white;
    background:rgba(255,255,255,.25);
    transform:translateY(-3px);
}

.slotBlock{
    width:31px;
    height:31px;
    border-radius:4px;

    box-shadow:
        inset 0 4px 0 rgba(255,255,255,.15),
        inset 0 -5px 0 rgba(0,0,0,.15);
}

.grass{
    background:#62ad43;
}

.dirt{
    background:#87582f;
}

.stone{
    background:#777b7e;
}

.wood{
    background:#9a6437;
}

.sand{
    background:#d8c078;
}

.leaf{
    background:#348044;
}

.slotName{
    position:absolute;
    bottom:2px;
    left:0;
    right:0;

    text-align:center;

    color:white;
    font-size:8px;
}

/* MESSAGE */
#message{
    position:fixed;
    top:75px;
    left:50%;

    transform:translateX(-50%);

    padding:9px 15px;

    color:white;
    background:rgba(0,0,0,.55);

    border-radius:12px;

    font-size:12px;

    opacity:0;
    pointer-events:none;

    transition:.25s;

    z-index:30;
}

#message.show{
    opacity:1;
}

/* HELP */
#help{
    position:fixed;

    left:50%;
    top:75%;

    transform:translateX(-50%);

    padding:8px 13px;

    border-radius:12px;

    background:rgba(0,0,0,.42);
    color:white;

    font-size:11px;

    pointer-events:none;

    z-index:10;

    opacity:.75;
}

/* BUILD BUTTON */
#buildButton{
    position:fixed;

    right:105px;
    bottom:28px;

    width:58px;
    height:58px;

    border:0;
    border-radius:18px;

    background:rgba(20,30,35,.72);

    color:white;
    font-size:25px;

    box-shadow:0 5px 15px rgba(0,0,0,.25);

    z-index:20;

    touch-action:none;
}

/* PORTRAIT */
#rotateMessage{
    display:none;

    position:fixed;
    inset:0;

    z-index:100;

    background:#20272b;

    color:white;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px;

    font-size:18px;
}

@media (orientation:portrait){
    #rotateMessage{
        display:flex;
    }
}

/* SMALL PHONE */
@media (max-height:500px){

    #controls{
        transform:scale(.85);
        transform-origin:bottom left;
        bottom:8px;
    }

    #jump{
        transform:scale(.85);
        transform-origin:bottom right;
        bottom:10px;
    }

    #buildButton{
        bottom:14px;
    }

    #inventory{
        bottom:8px;
        height:60px;
    }

    .slot{
        height:48px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="rotateMessage">
    📱<br><br>
    Please rotate your phone to landscape mode.
</div>

<div id="topbar">

    <button class="topButton" id="inventoryButton">
        🎒
    </button>

    <button class="topButton" id="resetButton">
        ↻
    </button>

</div>

<div id="crosshair"></div>

<div id="help">
    Tap = Build&nbsp;&nbsp; • &nbsp;&nbsp;Hold = Break&nbsp;&nbsp; • &nbsp;&nbsp;Drag = Look
</div>

<div id="message"></div>

<!-- MOVEMENT -->
<div id="controls">

    <button class="move" id="up">▲</button>
    <button class="move" id="down">▼</button>
    <button class="move" id="left">◀</button>
    <button class="move" id="right">▶</button>

</div>

<!-- JUMP -->
<button id="jump">⬆</button>

<!-- BUILD SHORTCUT -->
<button id="buildButton">🧱</button>

<!-- INVENTORY -->
<div id="inventory">

    <div class="slot selected" data-type="grass">
        <div class="slotBlock grass"></div>
        <div class="slotName">Grass</div>
    </div>

    <div class="slot" data-type="dirt">
        <div class="slotBlock dirt"></div>
        <div class="slotName">Dirt</div>
    </div>

    <div class="slot" data-type="stone">
        <div class="slotBlock stone"></div>
        <div class="slotName">Stone</div>
    </div>

    <div class="slot" data-type="wood">
        <div class="slotBlock wood"></div>
        <div class="slotName">Wood</div>
    </div>

    <div class="slot" data-type="sand">
        <div class="slotBlock sand"></div>
        <div class="slotName">Sand</div>
    </div>

    <div class="slot" data-type="leaf">
        <div class="slotBlock leaf"></div>
        <div class="slotName">Leaf</div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   BASIC SETUP
========================================================= */

const game = document.getElementById("game");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x79c9ee);

scene.fog = new THREE.Fog(
    0x79c9ee,
    35,
    100
);


/* CAMERA */

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.05,
    200
);

camera.position.set(
    0,
    3,
    8
);


/* RENDERER */

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;

game.appendChild(renderer.domElement);


/* =========================================================
   LIGHT
========================================================= */

const hemi = new THREE.HemisphereLight(
    0xbde8ff,
    0x5f6d3f,
    1.5
);

scene.add(hemi);


const sun = new THREE.DirectionalLight(
    0xffffff,
    1.6
);

sun.position.set(
    30,
    50,
    20
);

sun.castShadow = true;

scene.add(sun);


/* =========================================================
   MATERIALS
========================================================= */

const materials = {

    grass:
        new THREE.MeshLambertMaterial({
            color:0x62ad43
        }),

    dirt:
        new THREE.MeshLambertMaterial({
            color:0x87582f
        }),

    stone:
        new THREE.MeshLambertMaterial({
            color:0x777b7e
        }),

    wood:
        new THREE.MeshLambertMaterial({
            color:0x9a6437
        }),

    sand:
        new THREE.MeshLambertMaterial({
            color:0xd8c078
        }),

    leaf:
        new THREE.MeshLambertMaterial({
            color:0x348044
        })
};


/* =========================================================
   BLOCK SYSTEM
========================================================= */

const blockSize = 1;

const blocks = new Map();

const blockGeometry =
    new THREE.BoxGeometry(
        1,
        1,
        1
    );


function key(x,y,z){

    return `${x},${y},${z}`;

}


function addBlock(
    x,
    y,
    z,
    type="grass"
){

    const k = key(x,y,z);

    if(blocks.has(k)){
        return;
    }

    const mesh = new THREE.Mesh(
        blockGeometry,
        materials[type] || materials.grass
    );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    mesh.userData.block = true;
    mesh.userData.x = x;
    mesh.userData.y = y;
    mesh.userData.z = z;
    mesh.userData.type = type;

    scene.add(mesh);

    blocks.set(k,mesh);

    return mesh;
}


function removeBlock(
    x,
    y,
    z
){

    const k = key(x,y,z);

    const mesh = blocks.get(k);

    if(!mesh){
        return false;
    }

    scene.remove(mesh);

    blocks.delete(k);

    return true;
}


/* =========================================================
   WORLD
========================================================= */

const WORLD_SIZE = 34;


/* Ground */

for(
    let x=-WORLD_SIZE/2;
    x<=WORLD_SIZE/2;
    x++
){

    for(
        let z=-WORLD_SIZE/2;
        z<=WORLD_SIZE/2;
        z++
    ){

        addBlock(
            x,
            0,
            z,
            "grass"
        );

        addBlock(
            x,
            -1,
            z,
            "dirt"
        );

    }

}


/* =========================================================
   SMALL HILLS
========================================================= */

function makeHill(cx,cz,radius,height){

    for(
        let x=cx-radius;
        x<=cx+radius;
        x++
    ){

        for(
            let z=cz-radius;
            z<=cz+radius;
            z++
        ){

            const distance =
                Math.sqrt(
                    (x-cx)*(x-cx) +
                    (z-cz)*(z-cz)
                );

            if(distance > radius){
                continue;
            }

            const h =
                Math.max(
                    1,
                    Math.floor(
                        height *
                        (1-distance/radius)
                    )
                );

            for(
                let y=1;
                y<=h;
                y++
            ){

                addBlock(
                    x,
                    y,
                    z,
                    y===h
                    ? "grass"
                    : "dirt"
                );

            }

        }

    }

}


/* Small hills around the map */

makeHill(
    -11,
    -9,
    5,
    4
);

makeHill(
    11,
    -11,
    4,
    3
);

makeHill(
    13,
    10,
    5,
    4
);


/* =========================================================
   RIVER
========================================================= */

const riverZStart = -2;
const riverZEnd = 1;

const waterMaterial =
    new THREE.MeshLambertMaterial({
        color:0x3ca9d6,
        transparent:true,
        opacity:.75
    });


const waterGeometry =
    new THREE.BoxGeometry(
        1,
        .12,
        1
    );


for(
    let x=-WORLD_SIZE/2;
    x<=WORLD_SIZE/2;
    x++
){

    for(
        let z=riverZStart;
        z<=riverZEnd;
        z++
    ){

        const water =
            new THREE.Mesh(
                waterGeometry,
                waterMaterial
            );

        water.position.set(
            x,
            .56,
            z
        );

        scene.add(water);

    }

}


/* =========================================================
   TREES
========================================================= */

function makeTree(x,z){

    /* trunk */

    for(
        let y=1;
        y<=3;
        y++
    ){

        addBlock(
            x,
            y,
            z,
            "wood"
        );

    }


    /* leaves */

    for(
        let dx=-1;
        dx<=1;
        dx++
    ){

        for(
            let dz=-1;
            dz<=1;
            dz++
        ){

            addBlock(
                x+dx,
                4,
                z+dz,
                "leaf"
            );

        }

    }


    addBlock(
        x,
        5,
        z,
        "leaf"
    );

}


/* fixed trees */

[
    [-13,7],
    [-9,11],
    [-4,12],
    [5,11],
    [9,8],
    [14,4],
    [-14,-10],
    [14,-8],
    [8,-14],
    [-7,-13]
].forEach(
    p=>makeTree(p[0],p[1])
);


/* =========================================================
   PLAYER
========================================================= */

const player = {

    position:
        new THREE.Vector3(
            0,
            2.1,
            7
        ),

    velocity:
        new THREE.Vector3(),

    height:1.7,

    width:.55,

    onGround:false

};


camera.position.copy(
    player.position
);

camera.position.y += .5;


/* =========================================================
   MOVEMENT
========================================================= */

const move = {

    forward:false,
    backward:false,
    left:false,
    right:false

};


let canJump = false;


/* Buttons */

function setupHoldButton(
    element,
    property
){

    const start = e => {

        e.preventDefault();

        move[property] = true;

    };

    const stop = e => {

        e.preventDefault();

        move[property] = false;

    };

    element.addEventListener(
        "pointerdown",
        start
    );

    element.addEventListener(
        "pointerup",
        stop
    );

    element.addEventListener(
        "pointercancel",
        stop
    );

    element.addEventListener(
        "pointerleave",
        stop
    );

}


setupHoldButton(
    document.getElementById("up"),
    "forward"
);

setupHoldButton(
    document.getElementById("down"),
    "backward"
);

setupHoldButton(
    document.getElementById("left"),
    "left"
);

setupHoldButton(
    document.getElementById("right"),
    "right"
);


/* Jump */

document.getElementById("jump")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        if(player.onGround){

            player.velocity.y = 7;

            player.onGround = false;

        }

    }
);


/* =========================================================
   COLLISION
========================================================= */

function solidAt(
    x,
    y,
    z
){

    return blocks.has(
        key(
            Math.round(x),
            Math.round(y),
            Math.round(z)
        )
    );

}


function collidesAt(
    pos
){

    const minX =
        Math.floor(
            pos.x - player.width
        );

    const maxX =
        Math.floor(
            pos.x + player.width
        );

    const minY =
        Math.floor(
            pos.y - player.height
        );

    const maxY =
        Math.floor(
            pos.y + .2
        );

    const minZ =
        Math.floor(
            pos.z - player.width
        );

    const maxZ =
        Math.floor(
            pos.z + player.width
        );


    for(
        let x=minX;
        x<=maxX;
        x++
    ){

        for(
            let y=minY;
            y<=maxY;
            y++
        ){

            for(
                let z=minZ;
                z<=maxZ;
                z++
            ){

                if(
                    blocks.has(
                        key(x,y,z)
                    )
                ){

                    return true;

                }

            }

        }

    }

    return false;

}


/* =========================================================
   PLAYER UPDATE
========================================================= */

const clock =
    new THREE.Clock();


function updatePlayer(dt){

    const speed = 5.5;

    const direction =
        new THREE.Vector3();


    if(move.forward){
        direction.z -= 1;
    }

    if(move.backward){
        direction.z += 1;
    }

    if(move.left){
        direction.x -= 1;
    }

    if(move.right){
        direction.x += 1;
    }


    if(direction.lengthSq()>0){

        direction.normalize();

        direction.applyAxisAngle(
            new THREE.Vector3(0,1,0),
            yaw
        );

    }


    player.velocity.x =
        THREE.MathUtils.lerp(
            player.velocity.x,
            direction.x * speed,
            Math.min(1,dt*10)
        );


    player.velocity.z =
        THREE.MathUtils.lerp(
            player.velocity.z,
            direction.z * speed,
            Math.min(1,dt*10)
        );


    /* gravity */

    player.velocity.y -=
        18 * dt;


    /* X */

    const nextX =
        player.position.clone();

    nextX.x +=
        player.velocity.x * dt;


    if(!collidesAt(nextX)){

        player.position.x =
            nextX.x;

    }
    else{

        player.velocity.x = 0;

    }


    /* Z */

    const nextZ =
        player.position.clone();

    nextZ.z +=
        player.velocity.z * dt;


    if(!collidesAt(nextZ)){

        player.position.z =
            nextZ.z;

    }
    else{

        player.velocity.z = 0;

    }


    /* Y */

    const nextY =
        player.position.clone();

    nextY.y +=
        player.velocity.y * dt;


    if(!collidesAt(nextY)){

        player.position.y =
            nextY.y;

        player.onGround = false;

    }
    else{

        if(player.velocity.y < 0){

            player.onGround = true;

        }

        player.velocity.y = 0;

    }


    /* keep player in world */

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -16,
            16
        );

    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -16,
            16
        );


    /* camera */

    camera.position.copy(
        player.position
    );

    camera.position.y += .5;

}


/* =========================================================
   LOOK CONTROLS
========================================================= */

let yaw = 0;
let pitch = -0.08;

let looking = false;

let lastX = 0;
let lastY = 0;

let pointerMoved = false;


/* Touch state */

let pointerDown = false;

let pointerStartX = 0;
let pointerStartY = 0;

let longPressTimer = null;

let breaking = false;

const LONG_PRESS = 650;
const MOVE_LIMIT = 10;


/* =========================================================
   RAYCAST
========================================================= */

const raycaster =
    new THREE.Raycaster();


const pointer =
    new THREE.Vector2();


function getTargetBlock(){

    pointer.set(0,0);

    raycaster.setFromCamera(
        pointer,
        camera
    );

    const objects =
        Array.from(
            blocks.values()
        );

    const hits =
        raycaster.intersectObjects(
            objects,
            false
        );

    if(hits.length === 0){
        return null;
    }

    return hits[0];

}


/* =========================================================
   BREAK BLOCK
========================================================= */

function breakTarget(){

    const hit =
        getTargetBlock();

    if(!hit){
        return;
    }

    const block =
        hit.object;

    const x =
        block.userData.x;

    const y =
        block.userData.y;

    const z =
        block.userData.z;


    /* Don't remove the bottom world */

    if(y <= -1){
        return;
    }


    removeBlock(
        x,
        y,
        z
    );


    showMessage(
        "Block broken"
    );

}


/* =========================================================
   BUILD BLOCK
========================================================= */

let selectedType = "grass";


function buildTarget(){

    const hit =
        getTargetBlock();

    if(!hit){
        return;
    }


    const block =
        hit.object;


    const normal =
        hit.face.normal.clone();


    normal.transformDirection(
        block.matrixWorld
    );


    const x =
        block.userData.x +
        Math.round(normal.x);

    const y =
        block.userData.y +
        Math.round(normal.y);

    const z =
        block.userData.z +
        Math.round(normal.z);


    /* Don't build inside player */

    const testPosition =
        new THREE.Vector3(
            x,
            y+1,
            z
        );


    if(collidesAt(testPosition)){
        return;
    }


    addBlock(
        x,
        y,
        z,
        selectedType
    );


    showMessage(
        "Block placed"
    );

}


/* =========================================================
   WORLD POINTER CONTROLS
========================================================= */

renderer.domElement.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        pointerDown = true;

        pointerMoved = false;

        breaking = false;

        pointerStartX = e.clientX;
        pointerStartY = e.clientY;

        lastX = e.clientX;
        lastY = e.clientY;


        clearTimeout(
            longPressTimer
        );


        longPressTimer =
            setTimeout(
                ()=>{

                    if(
                        pointerDown &&
                        !pointerMoved
                    ){

                        breaking = true;

                        breakTarget();

                    }

                },
                LONG_PRESS
            );

    },
    {passive:false}
);


renderer.domElement.addEventListener(
    "pointermove",
    e=>{

        if(!pointerDown){
            return;
        }


        const dx =
            e.clientX -
            pointerStartX;

        const dy =
            e.clientY -
            pointerStartY;


        if(
            Math.abs(dx) > MOVE_LIMIT ||
            Math.abs(dy) > MOVE_LIMIT
        ){

            pointerMoved = true;

            clearTimeout(
                longPressTimer
            );


            if(!breaking){

                const moveX =
                    e.clientX-lastX;

                const moveY =
                    e.clientY-lastY;


                yaw -=
                    moveX * .006;

                pitch -=
                    moveY * .006;


                pitch =
                    THREE.MathUtils.clamp(
                        pitch,
                        -1.3,
                        1.3
                    );


                updateCameraRotation();

            }

        }


        lastX = e.clientX;
        lastY = e.clientY;

    },
    {passive:false}
);


renderer.domElement.addEventListener(
    "pointerup",
    e=>{

        e.preventDefault();

        clearTimeout(
            longPressTimer
        );


        if(
            pointerDown &&
            !pointerMoved &&
            !breaking
        ){

            buildTarget();

        }


        pointerDown = false;

        breaking = false;

    },
    {passive:false}
);


renderer.domElement.addEventListener(
    "pointercancel",
    ()=>{

        clearTimeout(
            longPressTimer
        );

        pointerDown = false;

        breaking = false;

    }
);


/* =========================================================
   CAMERA ROTATION
========================================================= */

function updateCameraRotation(){

    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;

}


/* =========================================================
   INVENTORY
========================================================= */

const inventory =
    document.getElementById(
        "inventory"
    );


document.getElementById(
    "inventoryButton"
)
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        inventory.classList.toggle(
            "show"
        );

    }
);


document.querySelectorAll(
    ".slot"
).forEach(
    slot=>{

        slot.addEventListener(
            "pointerdown",
            e=>{

                e.preventDefault();

                document.querySelectorAll(
                    ".slot"
                ).forEach(
                    s=>s.classList.remove(
                        "selected"
                    )
                );


                slot.classList.add(
                    "selected"
                );


                selectedType =
                    slot.dataset.type;


                inventory.classList.remove(
                    "show"
                );


                showMessage(
                    "Selected: " +
                    selectedType
                );

            }
        );

    }
);


/* =========================================================
   BUILD BUTTON
========================================================= */

document.getElementById(
    "buildButton"
)
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        buildTarget();

    }
);


/* =========================================================
   RESET
========================================================= */

document.getElementById(
    "resetButton"
)
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        player.position.set(
            0,
            2.1,
            7
        );

        player.velocity.set(
            0,
            0,
            0
        );

        yaw = 0;
        pitch = -.08;

        updateCameraRotation();

        showMessage(
            "Position reset"
        );

    }
);


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer = null;


function showMessage(text){

    const message =
        document.getElementById(
            "message"
        );

    message.textContent =
        text;

    message.classList.add(
        "show"
    );


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            ()=>{

                message.classList.remove(
                    "show"
                );

            },
            1000
        );

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   GAME LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    updatePlayer(dt);

    renderer.render(
        scene,
        camera
    );

}


updateCameraRotation();

animate();


/* =========================================================
   START MESSAGE
========================================================= */

setTimeout(
    ()=>{

        showMessage(
            "Welcome to your world!"
        );

    },
    500
);

</script>

</body>
</html>
