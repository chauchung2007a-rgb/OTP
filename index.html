<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no">

<title>Mine - Cambodia</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
}

canvas{
    display:block;
    touch-action:none;
}

/* ================= TOP LEFT ================= */

#mapBox{

    position:absolute;

    top:12px;
    left:12px;

    width:155px;
    height:125px;

    z-index:20;

    padding:8px;

    border-radius:15px;

    background:rgba(25,45,55,.72);

    color:white;

    backdrop-filter:blur(8px);

    pointer-events:none;
}

#mapTitle{

    font-size:17px;

    font-weight:bold;

    margin-bottom:5px;
}

#miniMap{

    width:100%;
    height:70px;

    border-radius:8px;

    background:
        linear-gradient(
            135deg,
            #4d9b4d 25%,
            #6db65a 25% 50%,
            #478e4b 50% 75%,
            #6aaa52 75%
        );

    position:relative;

    overflow:hidden;
}

#mapPlayer{

    position:absolute;

    width:10px;
    height:10px;

    background:white;

    border-radius:50%;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    box-shadow:0 0 5px white;
}

#coords{

    font-size:11px;

    margin-top:5px;
}

/* ================= TOP RIGHT ================= */

#status{

    position:absolute;

    z-index:20;

    top:12px;
    right:12px;

    display:flex;

    align-items:center;

    gap:8px;
}

.statusBox{

    padding:8px 12px;

    border-radius:13px;

    background:rgba(30,40,45,.72);

    color:white;

    font-weight:bold;

    backdrop-filter:blur(8px);
}

#pause{

    width:48px;
    height:48px;

    border:0;

    border-radius:14px;

    background:rgba(255,255,255,.72);

    font-size:22px;

    touch-action:none;
}

/* ================= CROSSHAIR ================= */

#crosshair{

    position:absolute;

    z-index:15;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:24px;
    height:24px;

    pointer-events:none;
}

#crosshair:before,
#crosshair:after{

    content:"";

    position:absolute;

    background:white;

    box-shadow:0 0 2px black;
}

#crosshair:before{

    width:2px;
    height:24px;

    left:11px;
}

#crosshair:after{

    width:24px;
    height:2px;

    top:11px;
}

/* ================= MOVEMENT ================= */

#movement{

    position:absolute;

    z-index:30;

    left:22px;
    bottom:24px;

    width:145px;
    height:145px;

    touch-action:none;
}

.move{

    position:absolute;

    width:52px;
    height:52px;

    border:1px solid rgba(255,255,255,.35);

    border-radius:14px;

    background:rgba(45,55,60,.62);

    color:white;

    font-size:23px;

    backdrop-filter:blur(5px);

    touch-action:none;
}

.move:active{

    transform:scale(.9);
}

#forward{

    left:46px;
    top:0;
}

#back{

    left:46px;
    bottom:0;
}

#left{

    left:0;
    top:46px;
}

#right{

    right:0;
    top:46px;
}

/* ================= ACTIONS ================= */

#actions{

    position:absolute;

    z-index:30;

    right:22px;
    bottom:25px;

    display:flex;

    flex-direction:column;

    gap:12px;

    align-items:center;

    touch-action:none;
}

.action{

    width:65px;
    height:65px;

    border:1px solid rgba(255,255,255,.35);

    border-radius:50%;

    background:rgba(45,55,60,.65);

    color:white;

    font-size:27px;

    backdrop-filter:blur(6px);

    touch-action:none;
}

.action:active{

    transform:scale(.9);
}

/* ================= HOTBAR ================= */

#hotbar{

    position:absolute;

    z-index:35;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    display:flex;

    gap:5px;

    padding:7px;

    border-radius:13px;

    background:rgba(25,30,33,.82);

    touch-action:none;
}

.slot{

    width:53px;
    height:53px;

    border:2px solid #52606a;

    border-radius:8px;

    background:#171b1e;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    font-size:25px;

    color:white;

    touch-action:none;
}

.slot.selected{

    border-color:white;

    box-shadow:
        0 0 0 2px
        rgba(255,255,255,.25);
}

.number{

    position:absolute;

    right:4px;
    bottom:2px;

    font-size:11px;

    color:white;
}

/* ================= PORTRAIT ================= */

#portrait{

    display:none;

    position:absolute;

    z-index:100;

    inset:0;

    background:#20252a;

    color:white;

    align-items:center;

    justify-content:center;

    text-align:center;

    font-size:21px;

    font-weight:bold;
}

@media(max-aspect-ratio:1/1){

    #portrait{

        display:flex;
    }
}

</style>
</head>

<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* =====================================================
   MINE V2
   3D WORLD + COLLISION
===================================================== */


/* ================= SCENE ================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x8fd3f4
    );

scene.fog =
    new THREE.Fog(
        0x8fd3f4,
        35,
        100
    );


/* ================= CAMERA ================= */

const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        0.1,
        200
    );

camera.position.set(
    0,
    3.6,
    8
);


/* ================= RENDERER ================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled =
    true;

document
    .getElementById("game")
    .appendChild(
        renderer.domElement
    );


/* ================= LIGHT ================= */

const skyLight =
    new THREE.HemisphereLight(
        0xbde9ff,
        0x56703f,
        2.2
    );

scene.add(
    skyLight
);


const sunLight =
    new THREE.DirectionalLight(
        0xffffff,
        2.5
    );

sunLight.position.set(
    -20,
    35,
    15
);

sunLight.castShadow =
    true;

scene.add(
    sunLight
);


/* ================= MATERIALS ================= */

const materials = {

    grass:
        new THREE.MeshLambertMaterial({
            color:0x55a83c
        }),

    dirt:
        new THREE.MeshLambertMaterial({
            color:0x8b5a38
        }),

    stone:
        new THREE.MeshLambertMaterial({
            color:0x858585
        }),

    wood:
        new THREE.MeshLambertMaterial({
            color:0x87562f
        }),

    sand:
        new THREE.MeshLambertMaterial({
            color:0xd8c078
        }),

    leaf:
        new THREE.MeshLambertMaterial({
            color:0x328c3c
        }),

    water:
        new THREE.MeshLambertMaterial({
            color:0x36a9df,
            transparent:true,
            opacity:.82
        })
};


/* ================= BLOCK DATA ================= */

const blocks = [];

const blockGeometry =
    new THREE.BoxGeometry(
        1,
        1,
        1
    );


function addBlock(
    x,
    y,
    z,
    type
){

    const mesh =
        new THREE.Mesh(
            blockGeometry,
            materials[type] ||
            materials.dirt
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow =
        true;

    mesh.receiveShadow =
        true;

    mesh.userData.type =
        type;

    scene.add(mesh);

    blocks.push(mesh);

    return mesh;
}


/* ================= WORLD ================= */

const WORLD = 20;


/* Ground */

for(
    let x=-WORLD;
    x<=WORLD;
    x++
){

    for(
        let z=-WORLD;
        z<=WORLD;
        z++
    ){

        addBlock(
            x,
            0,
            z,
            "grass"
        );

        addBlock(
            x,
            -1,
            z,
            "dirt"
        );

        addBlock(
            x,
            -2,
            z,
            "dirt"
        );
    }
}


/* ================= RIVER ================= */

for(
    let x=-WORLD;
    x<=WORLD;
    x++
){

    for(
        let z=-3;
        z<=0;
        z++
    ){

        const water =
            addBlock(
                x,
                .35,
                z,
                "water"
            );

        water.scale.y =
            .35;
    }
}


/* ================= TREES ================= */

function createTree(
    x,
    z
){

    for(
        let y=1;
        y<=4;
        y++
    ){

        addBlock(
            x,
            y,
            z,
            "wood"
        );
    }


    for(
        let dx=-2;
        dx<=2;
        dx++
    ){

        for(
            let dz=-2;
            dz<=2;
            dz++
        ){

            if(
                Math.abs(dx) +
                Math.abs(dz) < 4
            ){

                addBlock(
                    x+dx,
                    5,
                    z+dz,
                    "leaf"
                );

                addBlock(
                    x+dx,
                    6,
                    z+dz,
                    "leaf"
                );
            }
        }
    }
}


createTree(-8,-7);
createTree(-5,-9);
createTree(7,-8);
createTree(10,-5);
createTree(-11,6);
createTree(9,8);
createTree(-8,9);
createTree(12,10);


/* ================= HILLS ================= */

for(
    let x=-15;
    x<=15;
    x++
){

    for(
        let z=8;
        z<=14;
        z++
    ){

        const d =
            Math.abs(x)/15 +
            Math.abs(z-11)/6;

        if(d<1){

            const height =
                Math.floor(
                    2 +
                    (1-d)*5
                );

            for(
                let y=1;
                y<=height;
                y++
            ){

                addBlock(
                    x,
                    y,
                    z,
                    y===height
                    ? "grass"
                    : "stone"
                );
            }
        }
    }
}


/* ================= HOUSES ================= */

function createHouse(
    x,
    z
){

    for(
        let dx=0;
        dx<5;
        dx++
    ){

        for(
            let dz=0;
            dz<5;
            dz++
        ){

            addBlock(
                x+dx,
                1,
                z+dz,
                "wood"
            );
        }
    }


    for(
        let y=2;
        y<=4;
        y++
    ){

        for(
            let dx=0;
            dx<5;
            dx++
        ){

            addBlock(
                x+dx,
                y,
                z,
                "wood"
            );

            addBlock(
                x+dx,
                y,
                z+4,
                "wood"
            );
        }


        for(
            let dz=1;
            dz<4;
            dz++
        ){

            addBlock(
                x,
                y,
                z+dz,
                "wood"
            );

            addBlock(
                x+4,
                y,
                z+dz,
                "wood"
            );
        }
    }


    for(
        let dx=-1;
        dx<=5;
        dx++
    ){

        for(
            let dz=-1;
        dz<=5;
        dz++
        ){

            addBlock(
                x+dx,
                5,
                z+dz,
                "wood"
            );
        }
    }
}


createHouse(-14,-1);
createHouse(8,-1);


/* =====================================================
   PLAYER
===================================================== */

const player = {

    x:0,

    y:2,

    z:7,

    speed:.12,

    vy:0,

    height:1.8,

    radius:.3,

    onGround:true
};


/* ================= CAMERA ROTATION ================= */

let yaw = 0;

let pitch = -0.12;


/* ================= MOVEMENT ================= */

const moving = {

    forward:false,

    back:false,

    left:false,

    right:false
};


/* =====================================================
   COLLISION
===================================================== */

function isSolidBlock(
    x,
    y,
    z
){

    for(
        const block of blocks
    ){

        if(
            !block.parent
        ){
            continue;
        }

        const type =
            block.userData.type;

        if(type==="water"){
            continue;
        }

        const bx =
            block.position.x;

        const by =
            block.position.y;

        const bz =
            block.position.z;


        const minX =
            x-player.radius;

        const maxX =
            x+player.radius;

        const minY =
            y;

        const maxY =
            y+player.height;

        const minZ =
            z-player.radius;

        const maxZ =
            z+player.radius;


        const blockMinX =
            bx-.5;

        const blockMaxX =
            bx+.5;

        const blockMinY =
            by-.5;

        const blockMaxY =
            by+.5;

        const blockMinZ =
            bz-.5;

        const blockMaxZ =
            bz+.5;


        const hitX =
            maxX>blockMinX &&
            minX<blockMaxX;

        const hitY =
            maxY>blockMinY &&
            minY<blockMaxY;

        const hitZ =
            maxZ>blockMinZ &&
            minZ<blockMaxZ;


        if(
            hitX &&
            hitY &&
            hitZ
        ){

            return true;
        }
    }

    return false;
}


/* =====================================================
   MOVEMENT WITH COLLISION
===================================================== */

function movePlayer(){

    const speed =
        player.speed;


    const forwardX =
        Math.sin(yaw);

    const forwardZ =
        Math.cos(yaw);


    let moveX=0;

    let moveZ=0;


    if(moving.forward){

        moveX +=
            forwardX*speed;

        moveZ +=
            forwardZ*speed;
    }


    if(moving.back){

        moveX -=
            forwardX*speed;

        moveZ -=
            forwardZ*speed;
    }


    if(moving.left){

        moveX +=
            Math.sin(
                yaw +
                Math.PI/2
            )*speed;

        moveZ +=
            Math.cos(
                yaw +
                Math.PI/2
            )*speed;
    }


    if(moving.right){

        moveX +=
            Math.sin(
                yaw -
                Math.PI/2
            )*speed;

        moveZ +=
            Math.cos(
                yaw -
                Math.PI/2
            )*speed;
    }


    /* X collision */

    const nextX =
        player.x+moveX;


    if(
        !isSolidBlock(
            nextX,
            player.y,
            player.z
        )
    ){

        player.x =
            nextX;
    }


    /* Z collision */

    const nextZ =
        player.z+moveZ;


    if(
        !isSolidBlock(
            player.x,
            player.y,
            nextZ
        )
    ){

        player.z =
            nextZ;
    }


    /* Boundary */

    player.x =
        Math.max(
            -19,
            Math.min(
                19,
                player.x
            )
        );

    player.z =
        Math.max(
            -19,
            Math.min(
                19,
                player.z
            )
        );
}


/* =====================================================
   BUTTON CONTROL
===================================================== */

function holdButton(
    id,
    key
){

    const button =
        document.getElementById(
            id
        );


    function start(e){

        e.preventDefault();

        moving[key]=true;

        if(
            e.pointerId !== undefined
        ){

            button.setPointerCapture?.(
                e.pointerId
            );
        }
    }


    function stop(e){

        e.preventDefault();

        moving[key]=false;
    }


    button.addEventListener(
        "pointerdown",
        start
    );

    button.addEventListener(
        "pointerup",
        stop
    );

    button.addEventListener(
        "pointercancel",
        stop
    );

    button.addEventListener(
        "pointerleave",
        stop
    );
}


holdButton(
    "forward",
    "forward"
);

holdButton(
    "back",
    "back"
);

holdButton(
    "left",
    "left"
);

holdButton(
    "right",
    "right"
);


/* =====================================================
   JUMP
===================================================== */

document
    .getElementById("jump")
    .addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            if(
                player.onGround
            ){

                player.vy=.18;

                player.onGround=false;
            }
        }
    );


/* =====================================================
   PHYSICS
===================================================== */

function physics(){

    player.vy -= .008;

    const nextY =
        player.y +
        player.vy;


    if(
        player.vy < 0
    ){

        if(
            isSolidBlock(
                player.x,
                nextY,
                player.z
            )
        ){

            player.y =
                Math.ceil(
                    player.y
                );

            player.vy=0;

            player.onGround=true;

            return;
        }
    }


    player.y =
        nextY;


    if(
        player.y<=2
    ){

        player.y=2;

        player.vy=0;

        player.onGround=true;
    }
}


/* =====================================================
   LOOK AROUND
===================================================== */

let looking=false;

let lastX=0;

let lastY=0;


renderer.domElement.addEventListener(
    "pointerdown",
    e=>{

        looking=true;

        lastX=e.clientX;

        lastY=e.clientY;
    }
);


renderer.domElement.addEventListener(
    "pointermove",
    e=>{

        if(!looking){
            return;
        }


        const dx =
            e.clientX-lastX;

        const dy =
            e.clientY-lastY;


        yaw -=
            dx*.006;

        pitch -=
            dy*.004;


        pitch =
            Math.max(
                -.9,
                Math.min(
                    .7,
                    pitch
                )
            );


        lastX=e.clientX;

        lastY=e.clientY;
    }
);


renderer.domElement.addEventListener(
    "pointerup",
    ()=>{
        looking=false;
    }
);


renderer.domElement.addEventListener(
    "pointercancel",
    ()=>{
        looking=false;
    }
);


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

    camera.position.set(
        player.x,
        player.y+1.6,
        player.z
    );


    const direction =
        new THREE.Vector3(
            Math.sin(yaw),
            Math.sin(pitch),
            Math.cos(yaw)
        );


    camera.lookAt(
        camera.position.x+
        direction.x,

        camera.position.y+
        direction.y,

        camera.position.z+
        direction.z
    );
}


/* =====================================================
   BLOCK SELECTION
===================================================== */

let selectedType =
    "grass";


document
    .querySelectorAll(".slot")
    .forEach(slot=>{

        slot.addEventListener(
            "pointerdown",
            e=>{

                e.preventDefault();

                document
                    .querySelectorAll(".slot")
                    .forEach(
                        s=>
                        s.classList.remove(
                            "selected"
                        )
                    );

                slot.classList.add(
                    "selected"
                );

                selectedType =
                    slot.dataset.block;
            }
        );
    });


/* =====================================================
   RAYCAST
===================================================== */

const raycaster =
    new THREE.Raycaster();

const center =
    new THREE.Vector2(
        0,
        0
    );


/* =====================================================
   BREAK
===================================================== */

document
    .getElementById("break")
    .addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();


            raycaster.setFromCamera(
                center,
                camera
            );


            const hits =
                raycaster.intersectObjects(
                    blocks
                );


            if(
                hits.length===0
            ){

                return;
            }


            const block =
                hits[0].object;


            const distance =
                camera.position.distanceTo(
                    block.position
                );


            if(
                distance<=6
            ){

                scene.remove(
                    block
                );


                const index =
                    blocks.indexOf(
                        block
                    );


                if(index>=0){

                    blocks.splice(
                        index,
                        1
                    );
                }
            }
        }
    );


/* =====================================================
   PLACE
===================================================== */

document
    .getElementById("place")
    .addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();


            raycaster.setFromCamera(
                center,
                camera
            );


            const hits =
                raycaster.intersectObjects(
                    blocks
                );


            if(
                hits.length===0
            ){

                return;
            }


            const hit =
                hits[0];


            const block =
                hit.object;


            const distance =
                camera.position.distanceTo(
                    block.position
                );


            if(
                distance<=6
            ){

                const normal =
                    hit.face.normal;


                const position =
                    block.position.clone()
                    .add(normal);


                const bx =
                    Math.round(
                        position.x
                    );

                const by =
                    Math.round(
                        position.y
                    );

                const bz =
                    Math.round(
                        position.z
                    );


                /* Don't place inside player */

                if(
                    !isSolidBlock(
                        bx,
                        by,
                        bz
                    )
                ){

                    addBlock(
                        bx,
                        by,
                        bz,
                        selectedType
                    );
                }
            }
        }
    );


/* =====================================================
   COORDINATES
===================================================== */

function updateCoordinates(){

    document
        .getElementById("cx")
        .textContent =
        Math.round(
            player.x
        );


    document
        .getElementById("cy")
        .textContent =
        Math.round(
            player.y
        );


    document
        .getElementById("cz")
        .textContent =
        Math.round(
            player.z
        );


    const mapPlayer =
        document.getElementById(
            "mapPlayer"
        );


    mapPlayer.style.left =
        (
            50+
            player.x*1.8
        )+"%";


    mapPlayer.style.top =
        (
            50+
            player.z*1.8
        )+"%";
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.key==="ArrowUp" ||
            e.key==="w"
        ){

            moving.forward=true;
        }


        if(
            e.key==="ArrowDown" ||
            e.key==="s"
        ){

            moving.back=true;
        }


        if(
            e.key==="ArrowLeft" ||
            e.key==="a"
        ){

            moving.left=true;
        }


        if(
            e.key==="ArrowRight" ||
            e.key==="d"
        ){

            moving.right=true;
        }
    }
);


document.addEventListener(
    "keyup",
    e=>{

        if(
            e.key==="ArrowUp" ||
            e.key==="w"
        ){

            moving.forward=false;
        }


        if(
            e.key==="ArrowDown" ||
            e.key==="s"
        ){

            moving.back=false;
        }


        if(
            e.key==="ArrowLeft" ||
            e.key==="a"
        ){

            moving.left=false;
        }


        if(
            e.key==="ArrowRight" ||
            e.key==="d"
        ){

            moving.right=false;
        }
    }
);


/* =====================================================
   GAME LOOP
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    movePlayer();

    physics();

    updateCamera();

    updateCoordinates();


    renderer.render(
        scene,
        camera
    );
}


updateCamera();

animate();

</script>
