<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Natural World Builder</title>

<style>
*{
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#8ed8f5;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
}

/* =========================
   TOP BAR
========================= */

#topbar{
    position:fixed;
    top:10px;
    left:10px;
    right:10px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:20;
    pointer-events:none;
}

.topGroup{
    display:flex;
    gap:8px;
}

.topButton{
    width:48px;
    height:48px;

    border:0;
    border-radius:15px;

    background:rgba(22,30,34,.72);
    color:white;

    font-size:23px;

    box-shadow:
        0 5px 14px rgba(0,0,0,.25);

    pointer-events:auto;
    touch-action:none;
}

/* =========================
   FLY
========================= */

#flyButton.active{
    background:#4ca7d8;
}

/* =========================
   CROSSHAIR
========================= */

#crosshair{
    position:fixed;

    left:50%;
    top:50%;

    width:22px;
    height:22px;

    transform:translate(-50%,-50%);

    pointer-events:none;
    z-index:10;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 3px #000;
}

#crosshair:before{
    width:22px;
    height:2px;
    top:10px;
    left:0;
}

#crosshair:after{
    width:2px;
    height:22px;
    top:0;
    left:10px;
}

/* =========================
   MESSAGE
========================= */

#message{
    position:fixed;

    top:68px;
    left:50%;

    transform:translateX(-50%);

    padding:8px 14px;

    border-radius:12px;

    background:rgba(0,0,0,.55);
    color:white;

    font-size:12px;

    opacity:0;
    pointer-events:none;

    transition:.2s;

    z-index:40;
}

#message.show{
    opacity:1;
}

/* =========================
   MOVEMENT PAD
========================= */

#movement{
    position:fixed;

    left:15px;
    bottom:15px;

    width:165px;
    height:165px;

    z-index:20;
}

.moveButton{
    position:absolute;

    width:54px;
    height:54px;

    border:0;
    border-radius:17px;

    background:rgba(20,28,32,.72);
    color:white;

    font-size:22px;
    font-weight:bold;

    box-shadow:
        0 5px 14px rgba(0,0,0,.25);

    touch-action:none;
}

#forward{
    left:55px;
    top:0;
}

#backward{
    left:55px;
    bottom:0;
}

#moveLeft{
    left:0;
    top:55px;
}

#moveRight{
    right:0;
    top:55px;
}

/* =========================
   FLY UP/DOWN
========================= */

#verticalControls{
    position:fixed;

    right:15px;
    bottom:100px;

    display:flex;
    flex-direction:column;

    gap:8px;

    z-index:20;
}

.verticalButton{
    width:50px;
    height:50px;

    border:0;
    border-radius:15px;

    background:rgba(20,28,32,.70);
    color:white;

    font-size:20px;

    touch-action:none;
}

/* =========================
   JUMP
========================= */

#jump{
    position:fixed;

    right:18px;
    bottom:18px;

    width:70px;
    height:70px;

    border:0;
    border-radius:50%;

    background:rgba(20,28,32,.75);
    color:white;

    font-size:28px;

    box-shadow:
        0 6px 16px rgba(0,0,0,.3);

    z-index:20;
    touch-action:none;
}

/* =========================
   BUILD BUTTON
========================= */

#buildButton{
    position:fixed;

    right:100px;
    bottom:25px;

    width:58px;
    height:58px;

    border:0;
    border-radius:18px;

    background:rgba(20,28,32,.75);
    color:white;

    font-size:25px;

    z-index:20;
    touch-action:none;
}

/* =========================
   BAG
========================= */

#bagPanel{
    position:fixed;

    left:50%;
    top:50%;

    width:min(580px,92vw);
    max-height:82vh;

    transform:
        translate(-50%,-50%)
        scale(.95);

    background:rgba(27,35,38,.94);

    border:1px solid rgba(255,255,255,.16);

    border-radius:24px;

    padding:16px;

    color:white;

    opacity:0;
    pointer-events:none;

    transition:.2s;

    z-index:50;

    overflow:auto;
}

#bagPanel.show{
    opacity:1;
    pointer-events:auto;

    transform:
        translate(-50%,-50%)
        scale(1);
}

.bagHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:14px;
}

.bagTitle{
    font-size:19px;
    font-weight:bold;
}

.closeBag{
    width:38px;
    height:38px;

    border:0;
    border-radius:12px;

    background:rgba(255,255,255,.12);

    color:white;
    font-size:20px;
}

.categoryTitle{
    margin:
        15px 0
        8px;

    font-size:13px;
    opacity:.75;
}

.itemGrid{
    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(82px,1fr));

    gap:8px;
}

.buildItem{
    min-height:72px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;

    background:rgba(255,255,255,.07);

    color:white;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:5px;

    font-size:11px;

    touch-action:none;
}

.buildItem.selected{
    border:2px solid #8edcff;
    background:rgba(142,220,255,.16);
}

.itemIcon{
    font-size:26px;
}

/* =========================
   HELP
========================= */

#hint{
    position:fixed;

    left:50%;
    bottom:10px;

    transform:translateX(-50%);

    color:white;

    font-size:10px;

    padding:6px 10px;

    border-radius:10px;

    background:rgba(0,0,0,.30);

    pointer-events:none;

    z-index:10;
}

/* =========================
   PORTRAIT
========================= */

#rotate{
    display:none;

    position:fixed;
    inset:0;

    z-index:100;

    background:#20272b;

    color:white;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px;

    font-size:18px;
}

@media (orientation:portrait){
    #rotate{
        display:flex;
    }
}

/* =========================
   SMALL SCREEN
========================= */

@media(max-height:500px){

    #movement{
        transform:scale(.82);
        transform-origin:bottom left;
        bottom:4px;
        left:7px;
    }

    #jump{
        transform:scale(.85);
        transform-origin:bottom right;
        bottom:7px;
        right:8px;
    }

    #buildButton{
        bottom:13px;
        right:85px;
    }

    #verticalControls{
        right:7px;
        bottom:78px;
    }

    #hint{
        display:none;
    }
}
</style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x8ed8f5);

scene.fog =
    new THREE.Fog(
        0x8ed8f5,
        55,
        170
    );


/* CAMERA */

const camera =
    new THREE.PerspectiveCamera(
        70,
        innerWidth / innerHeight,
        .05,
        500
    );


/* RENDERER */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        1.8
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* =========================================================
   LIGHT
========================================================= */

const hemi =
    new THREE.HemisphereLight(
        0xdaf4ff,
        0x63704d,
        1.8
    );

scene.add(hemi);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    50,
    80,
    35
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -80;
sun.shadow.camera.right = 80;
sun.shadow.camera.top = 80;
sun.shadow.camera.bottom = -80;

scene.add(sun);


/* =========================================================
   MATERIALS
========================================================= */

const mat = {

    grass:
        new THREE.MeshLambertMaterial({
            color:0x5d9f48
        }),

    dirt:
        new THREE.MeshLambertMaterial({
            color:0x79502f
        }),

    sand:
        new THREE.MeshLambertMaterial({
            color:0xd6bf80
        }),

    stone:
        new THREE.MeshLambertMaterial({
            color:0x777b7d
        }),

    road:
        new THREE.MeshLambertMaterial({
            color:0x34383b
        }),

    sidewalk:
        new THREE.MeshLambertMaterial({
            color:0xb9b9ae
        }),

    roadline:
        new THREE.MeshLambertMaterial({
            color:0xe8d34e
        }),

    wood:
        new THREE.MeshLambertMaterial({
            color:0x7c4d2b
        }),

    leaf:
        new THREE.MeshLambertMaterial({
            color:0x3e823f
        }),

    roof:
        new THREE.MeshLambertMaterial({
            color:0x8e4638
        }),

    wall:
        new THREE.MeshLambertMaterial({
            color:0xd5c2a1
        }),

    glass:
        new THREE.MeshLambertMaterial({
            color:0x6daec7
        }),

    white:
        new THREE.MeshLambertMaterial({
            color:0xe7e5d8
        }),

    black:
        new THREE.MeshLambertMaterial({
            color:0x202224
        }),

    yellow:
        new THREE.MeshLambertMaterial({
            color:0xd4a72c
        }),

    water:
        new THREE.MeshLambertMaterial({
            color:0x3dadd2,
            transparent:true,
            opacity:.68
        })

};


/* =========================================================
   WORLD / CHUNKS
========================================================= */

const CHUNK_SIZE = 24;

const chunks =
    new Map();

const objects =
    new Map();

const buildObjects = [];


/* block geometry */

const blockGeometry =
    new THREE.BoxGeometry(
        1,
        1,
        1
    );


function blockKey(x,y,z){
    return `${x}|${y}|${z}`;
}


function chunkKey(cx,cz){
    return `${cx}|${cz}`;
}


function addBlock(
    x,
    y,
    z,
    material,
    type="grass"
){

    const key =
        blockKey(x,y,z);

    if(objects.has(key)){
        return objects.get(key);
    }

    const mesh =
        new THREE.Mesh(
            blockGeometry,
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    mesh.userData.kind = "block";
    mesh.userData.type = type;

    mesh.userData.x = x;
    mesh.userData.y = y;
    mesh.userData.z = z;

    scene.add(mesh);

    objects.set(
        key,
        mesh
    );

    return mesh;
}


function removeBlock(x,y,z){

    const key =
        blockKey(x,y,z);

    const object =
        objects.get(key);

    if(!object){
        return false;
    }

    scene.remove(object);

    objects.delete(key);

    return true;
}


/* =========================================================
   TERRAIN HEIGHT
========================================================= */

function terrainHeight(x,z){

    let h = 0;

    h +=
        Math.sin(x*.055) * 2.0;

    h +=
        Math.sin(z*.065) * 1.5;

    h +=
        Math.sin((x+z)*.035) * 1.2;

    h +=
        Math.sin(x*.14 + z*.09) * .5;

    return Math.max(
        0,
        Math.floor(h + 1)
    );
}


/* =========================================================
   NATURAL TREE
========================================================= */

function createNaturalTree(
    x,
    y,
    z,
    scale=1
){

    const group =
        new THREE.Group();

    group.position.set(
        x,
        y,
        z
    );

    group.scale.setScalar(
        scale
    );


    /* trunk */

    const trunkGeometry =
        new THREE.CylinderGeometry(
            .18,
            .25,
            2.8,
            7
        );

    const trunk =
        new THREE.Mesh(
            trunkGeometry,
            mat.wood
        );

    trunk.position.y = 1.4;

    trunk.castShadow = true;

    group.add(trunk);


    /* branches */

    const branchGeometry =
        new THREE.CylinderGeometry(
            .07,
            .11,
            1.15,
            6
        );


    for(let i=0;i<3;i++){

        const branch =
            new THREE.Mesh(
                branchGeometry,
                mat.wood
            );

        branch.position.set(
            Math.sin(i*2.1)*.35,
            2.05 + i*.22,
            Math.cos(i*2.1)*.35
        );

        branch.rotation.z =
            .55 * Math.sin(i*2.1);

        branch.rotation.x =
            .45 * Math.cos(i*2.1);

        branch.castShadow = true;

        group.add(branch);

    }


    /* leaves */

    const leafGeometry =
        new THREE.SphereGeometry(
            .85,
            8,
            7
        );


    const leafPositions = [

        [0,3.0,0,1.25],

        [-.55,2.75,.05,.8],

        [.55,2.75,.05,.85],

        [0,2.7,.55,.8],

        [0,2.7,-.55,.82],

        [-.25,3.45,0,.65],

        [.35,3.35,.15,.65]

    ];


    leafPositions.forEach(p=>{

        const leaf =
            new THREE.Mesh(
                leafGeometry,
                mat.leaf
            );

        leaf.position.set(
            p[0],
            p[1],
            p[2]
        );

        leaf.scale.setScalar(
            p[3]
        );

        leaf.castShadow = true;

        group.add(leaf);

    });


    group.userData.kind =
        "tree";

    scene.add(group);

    buildObjects.push(group);

    return group;
}


/* =========================================================
   GRASS PLANT
========================================================= */

function createGrass(
    x,y,z
){

    const group =
        new THREE.Group();

    group.position.set(
        x,y+.52,z
    );


    for(let i=0;i<4;i++){

        const geo =
            new THREE.ConeGeometry(
                .025,
                .25 + Math.random()*.2,
                3
            );

        const m =
            new THREE.Mesh(
                geo,
                new THREE.MeshLambertMaterial({
                    color:
                        i%2
                        ? 0x4d8e3f
                        : 0x6aaa4a
                })
            );

        m.position.set(
            (Math.random()-.5)*.25,
            .12,
            (Math.random()-.5)*.25
        );

        m.rotation.z =
            (Math.random()-.5)*.5;

        group.add(m);

    }

    scene.add(group);

    buildObjects.push(group);
}


/* =========================================================
   GENERATE CHUNK
========================================================= */

function generateChunk(
    cx,
    cz
){

    const ck =
        chunkKey(cx,cz);

    if(chunks.has(ck)){
        return;
    }

    chunks.set(ck,true);


    const startX =
        cx * CHUNK_SIZE;

    const startZ =
        cz * CHUNK_SIZE;


    for(
        let lx=0;
        lx<CHUNK_SIZE;
        lx++
    ){

        for(
            let lz=0;
            lz<CHUNK_SIZE;
            lz++
        ){

            const x =
                startX + lx;

            const z =
                startZ + lz;


            const h =
                terrainHeight(x,z);


            /* base */

            for(
                let y=-2;
                y<=h;
                y++
            ){

                let material =
                    mat.dirt;

                let type =
                    "dirt";


                if(y===h){

                    material =
                        mat.grass;

                    type =
                        "grass";

                }


                addBlock(
                    x,
                    y,
                    z,
                    material,
                    type
                );

            }


            /* natural grass */

            if(
                Math.random() < .035 &&
                h > 0
            ){

                createGrass(
                    x,
                    h,
                    z
                );

            }


            /* trees */

            const distanceFromStart =
                Math.sqrt(
                    x*x + z*z
                );


            if(
                Math.random() < .009 &&
                distanceFromStart > 10
            ){

                createNaturalTree(
                    x,
                    h+.5,
                    z,
                    .8 +
                    Math.random()*.5
                );

            }

        }

    }

}


/* =========================================================
   LOAD NEARBY WORLD
========================================================= */

function updateChunks(){

    const cx =
        Math.floor(
            player.position.x /
            CHUNK_SIZE
        );

    const cz =
        Math.floor(
            player.position.z /
            CHUNK_SIZE
        );


    const radius = 2;


    for(
        let x=cx-radius;
        x<=cx+radius;
        x++
    ){

        for(
            let z=cz-radius;
            z<=cz+radius;
            z++
        ){

            generateChunk(
                x,
                z
            );

        }

    }

}


/* =========================================================
   PLAYER

/* =========================================================

    backward:false,

};

/* =========================================================
   BUTTON HOLD SYSTEM
========================================================= */

function holdButton(
    id,
    property
){

    const el =
        document.getElementById(id);


    function start(e){

        e.preventDefault();

        keys[property] = true;

        try{
            el.setPointerCapture(
                e.pointerId
            );
        }catch(_){}

    }


    function stop(e){

        e.preventDefault();

        keys[property] = false;

    }


    el.addEventListener(
        "pointerdown",
        start,
        {passive:false}
    );

    el.addEventListener(
        "pointerup",
        stop,
        {passive:false}
    );

    el.addEventListener(
        "pointercancel",
        stop,
        {passive:false}
    );

    el.addEventListener(
        "lostpointercapture",
        stop,
        {passive:false}
    );

}

/* =========================================================
   COLLISION
========================================================= */

function solidAt(
    x,y,z
){

    return objects.has(
        blockKey(
            Math.round(x),
            Math.round(y),
            Math.round(z)
        )
    );

}


function collides(
    pos
){

    const minX =
        Math.floor(
            pos.x-player.radius
        );

    const maxX =
        Math.floor(
            pos.x+player.radius
        );

    const minY =
        Math.floor(
            pos.y-player.height
        );

    const maxY =
        Math.floor(
            pos.y+.2
        );

    const minZ =
        Math.floor(
            pos.z-player.radius
        );

    const maxZ =
        Math.floor(
            pos.z+player.radius
        );


    for(
        let x=minX;
        x<=maxX;
        x++
    ){

        for(
            let y=minY;
            y<=maxY;
            y++
        ){

            for(
                let z=minZ;
                z<=maxZ;
                z++
            ){

                if(
                    solidAt(
                        x,y,z
                    )
                ){

                    return true;

                }

            }

        }

    }

    return false;
}


/* =========================================================
   CAMERA
========================================================= */

let yaw = 0;

let pitch = -.10;


function updateCamera(){

    camera.rotation.order =
        "YXZ";

    camera.rotation.y =
        yaw;

    camera.rotation.x =
        pitch;

    camera.position.copy(
        player.position
    );

    camera.position.y += .55;

}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    const speed =
        flyMode
        ? 9
        : 5.5;


    const direction =
        new THREE.Vector3();


    if(keys.forward)
        direction.z -= 1;

    if(keys.backward)
        direction.z += 1;

    if(keys.left)
        direction.x -= 1;

    if(keys.right)
        direction.x += 1;


    if(direction.lengthSq()>0){

        direction.normalize();

        direction.applyAxisAngle(
            new THREE.Vector3(0,1,0),
            yaw
        );

    }


    player.velocity.x =
        THREE.MathUtils.lerp(
            player.velocity.x,
            direction.x*speed,
            Math.min(1,dt*9)
        );


    player.velocity.z =
        THREE.MathUtils.lerp(
            player.velocity.z,
            direction.z*speed,
            Math.min(1,dt*9)
        );


    /* ===================
       FLY
    =================== */

    if(flyMode){

        player.velocity.y =
            0;


        if(keys.up)
            player.velocity.y =
                speed;

        if(keys.down)
            player.velocity.y =
                -speed;

    }


    /* ===================
       WALK GRAVITY
    =================== */

    else{

        player.velocity.y -=
            18*dt;

    }


    /* X */

    const nextX =
        player.position.clone();

    nextX.x +=
        player.velocity.x*dt;


    if(
        !collides(nextX) ||
        flyMode
    ){

        player.position.x =
            nextX.x;

    }
    else{

        player.velocity.x =
            0;

    }


    /* Z */

    const nextZ =
        player.position.clone();

    nextZ.z +=
        player.velocity.z*dt;


    if(
        !collides(nextZ) ||
        flyMode
    ){

        player.position.z =
            nextZ.z;

    }
    else{

        player.velocity.z =
            0;

    }


    /* Y */

    const nextY =
        player.position.clone();

    nextY.y +=
        player.velocity.y*dt;


    if(
        !collides(nextY) ||
        flyMode
    ){

        player.position.y =
            nextY.y;

        if(!flyMode)
            player.onGround =
                false;

    }
    else{

        if(
            player.velocity.y < 0
        ){

            player.onGround =
                true;

        }

        player.velocity.y =
            0;

    }


    if(
        player.position.y < -10
    ){

        player.position.set(
            0,
            5,
            10
        );

        player.velocity.set(
            0,0,0
        );

    }


    updateCamera();

    updateChunks();

}


/* =========================================================
   RAYCAST
========================================================= */

const raycaster =
    new THREE.Raycaster();

const center =
    new THREE.Vector2(
        0,
        0
    );


function getBlockTarget(){

    raycaster.setFromCamera(
        center,
        camera
    );


    const meshes =
        Array.from(
            objects.values()
        );


    const hits =
        raycaster.intersectObjects(
            meshes,
            false
        );


    if(!hits.length)
        return null;


    return hits[0];

}


/* =========================================================
   SELECTED BUILD TYPE
========================================================= */

let selectedType =
    "grass";


/* =========================================================
   BUILD
========================================================= */

function build(){

    const hit =
        getBlockTarget();

    if(!hit)
        return;


    const block =
        hit.object;


    const normal =
        hit.face.normal.clone();


    normal.transformDirection(
        block.matrixWorld
    );


    const x =
        block.userData.x +
        Math.round(normal.x);

    const y =
        block.userData.y +
        Math.round(normal.y);

    const z =
        block.userData.z +
        Math.round(normal.z);


    /* basic terrain blocks */

    if(
        [
            "grass",
            "dirt",
            "sand",
            "stone"
        ].includes(selectedType)
    ){

        addBlock(
            x,
            y,
            z,
            mat[selectedType],
            selectedType
        );

        showMessage(
            "🧱 Block placed"
        );

        return;

    }


    /* road */

    if(
        selectedType === "road"
    ){

        addBlock(
            x,
            y,
            z,
            mat.road,
            "road"
        );

        showMessage(
            "🛣️ Road placed"
        );

        return;

    }


    if(
        selectedType === "sidewalk"
    ){

        addBlock(
            x,
            y,
            z,
            mat.sidewalk,
            "sidewalk"
        );

        return;

    }


    if(
        selectedType === "roadline"
    ){

        addBlock(
            x,
            y+.52,
            z,
            mat.roadline,
            "roadline"
        );

        return;

    }


    if(
        selectedType === "parking"
    ){

        addBlock(
            x,
            y,
            z,
            mat.road,
            "parking"
        );

        return;

    }


    /* tree */

    if(
        selectedType === "tree"
    ){

        createNaturalTree(
            x,
            y+.5,
            z,
            .85 +
            Math.random()*.35
        );

        showMessage(
            "🌳 Tree placed"
        );

        return;

    }


    /* building */

    createBuilding(
        selectedType,
        x,
        y,
        z
    );

}


/* =========================================================
   BREAK
========================================================= */

function breakTarget(){

    const hit =
        getBlockTarget();

    if(!hit)
        return;


    const block =
        hit.object;


    const x =
        block.userData.x;

    const y =
        block.userData.y;

    const z =
        block.userData.z;


    if(y <= -2)
        return;


    removeBlock(
        x,y,z
    );


    showMessage(
        "Block removed"
    );

}


/* =========================================================
   BUILDINGS
========================================================= */

function createBox(
    material,
    x,y,z,
    sx,sy,sz
){

    const geometry =
        new THREE.BoxGeometry(
            sx,sy,sz
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        x,y,z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    buildObjects.push(mesh);

    return mesh;
}


function createBuilding(
    type,
    x,y,z
){

    let width = 5;
    let height = 3;
    let depth = 5;


    if(type==="largehouse"){
        width = 7;
        height = 4;
        depth = 7;
    }

    if(type==="apartment"){
        width = 7;
        height = 9;
        depth = 7;
    }

    if(type==="shop"){
        width = 7;
        height = 4;
        depth = 6;
    }

    if(type==="school"){
        width = 10;
        height = 4;
        depth = 7;
    }

    if(type==="hospital"){
        width = 10;
        height = 5;
        depth = 9;
    }


    /* foundation */

    createBox(
        mat.stone,
        x,
        y+.5,
        z,
        width,
        1,
        depth
    );


    /* walls */

    createBox(
        mat.wall,
        x,
        y+1+height/2,
        z,
        width,
        height,
        depth
    );


    /* front glass */

    const windowCount =
        Math.max(
            2,
            Math.floor(width/2)
        );


    for(
        let i=0;
        i<windowCount;
        i++
    ){

        const wx =
            x -
            width/2 +
            1 +
            i*2;

        createBox(
            mat.glass,
            wx,
            y+2,
            z-depth/2-.03,
            .75,
            1.1,
            .08
        );

    }


    /* roof */

    createBox(
        mat.roof,
        x,
        y+height+1,
        z,
        width+.5,
        .55,
        depth+.5
    );


    /* door */

    createBox(
        mat.wood,
        x,
        y+1.15,
        z-depth/2-.05,
        1,
        2.1,
        .12
    );


    showMessage(
        "🏠 Building placed"
    );

}


/* =========================================================
   POINTER BUILD / BREAK / LOOK
========================================================= */

let pointerDown =
    false;

let pointerMoved =
    false;

let breaking =
    false;

let startX = 0;
let startY = 0;

let lastX = 0;
let lastY = 0;

let breakTimer = null;

const LONG_PRESS =
    600;

const MOVE_LIMIT =
    9;


/* Ignore controls if pointer starts on UI */

function isUI(target){

    return (
        target.closest(
            "#topbar,#movement,#verticalControls,#jump,#buildButton,#bagPanel"
        ) !== null
    );

}


/* pointer down */

renderer.domElement.addEventListener(
    "pointerdown",
    e=>{

        if(isUI(e.target))
            return;


        e.preventDefault();

        pointerDown =
            true;

        pointerMoved =
            false;

        breaking =
            false;


        startX =
            e.clientX;

        startY =
            e.clientY;

        lastX =
            e.clientX;

        lastY =
            e.clientY;


        try{
            renderer.domElement.setPointerCapture(
                e.pointerId
            );
        }catch(_){}


        clearTimeout(
            breakTimer
        );


        breakTimer =
            setTimeout(
                ()=>{

                    if(
                        pointerDown &&
                        !pointerMoved
                    ){

                        breaking =
                            true;

                        breakTarget();

                    }

                },
                LONG_PRESS
            );

    },
    {passive:false}
);


/* pointer move */

renderer.domElement.addEventListener(
    "pointermove",
    e=>{

        if(!pointerDown)
            return;


        const dx =
            e.clientX-startX;

        const dy =
            e.clientY-startY;


        if(
            Math.abs(dx)>MOVE_LIMIT ||
            Math.abs(dy)>MOVE_LIMIT
        ){

            pointerMoved =
                true;

            clearTimeout(
                breakTimer
            );


            if(!breaking){

                const lookX =
                    e.clientX-lastX;

                const lookY =
                    e.clientY-lastY;


                yaw -=
                    lookX*.006;

                pitch -=
                    lookY*.006;


                pitch =
                    THREE.MathUtils.clamp(
                        pitch,
                        -1.45,
                        1.45
                    );


                updateCamera();

            }

        }


        lastX =
            e.clientX;

        lastY =
            e.clientY;

    },
    {passive:false}
);


/* pointer up */

renderer.domElement.addEventListener(
    "pointerup",
    e=>{

        e.preventDefault();


        clearTimeout(
            breakTimer
        );


        if(
            pointerDown &&
            !pointerMoved &&
            !breaking
        ){

            build();

        }


        pointerDown =
            false;

        breaking =
            false;

    },
    {passive:false}
);


renderer.domElement.addEventListener(
    "pointercancel",
    ()=>{

        clearTimeout(
            breakTimer
        );

        pointerDown =
            false;

        breaking =
            false;

    }
);

========================================================= */

    "resize",
    ()=>{

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   GAME LOOP
========================================================= */

const clock =
    new THREE.Clock();


let chunkTimer = 0;


function animate(){

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    updatePlayer(dt);


    chunkTimer += dt;


    if(chunkTimer>.5){

        updateChunks();

        chunkTimer = 0;

    }


    renderer.render(
        scene,
        camera
    );

}
