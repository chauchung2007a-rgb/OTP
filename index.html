<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mine</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#82cef1;
    font-family:Arial,sans-serif;
}

#game{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#82cef1;
}

#world{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:linear-gradient(
        #75c8ef 0%,
        #b8e8fa 55%,
        #dceff5 100%
    );
}

/* Sun */
#sun{
    position:absolute;
    width:65px;
    height:65px;
    right:7%;
    top:10%;
    border-radius:50%;
    background:#ffd84d;
    box-shadow:0 0 30px rgba(255,216,77,.6);
}

/* Clouds */
.cloud{
    position:absolute;
    width:95px;
    height:25px;
    background:rgba(255,255,255,.75);
    border-radius:30px;
}

.cloud:before,
.cloud:after{
    content:"";
    position:absolute;
    background:rgba(255,255,255,.75);
    border-radius:50%;
}

.cloud:before{
    width:42px;
    height:42px;
    left:15px;
    top:-20px;
}

.cloud:after{
    width:35px;
    height:35px;
    right:15px;
    top:-14px;
}

/* Mountains */
.mountain{
    position:absolute;
    bottom:32%;
    width:0;
    height:0;
    border-left:110px solid transparent;
    border-right:110px solid transparent;
    border-bottom:190px solid #71947d;
    opacity:.8;
}

.mountain.m1{left:8%;}
.mountain.m2{
    left:38%;
    border-left-width:145px;
    border-right-width:145px;
    border-bottom-width:230px;
}
.mountain.m3{right:4%;}

/* Ground */
#ground{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:34%;
    background:#93613f;
    border-top:12px solid #55a83c;
}

/* Grass texture */
#ground:before{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:-12px;
    height:12px;
    background:#69c847;
}

/* River */
#river{
    position:absolute;
    left:0;
    right:0;
    bottom:19%;
    height:12%;
    background:#43a9dd;
    transform:skewY(-2deg);
    box-shadow:0 5px 0 rgba(255,255,255,.15) inset;
}

/* Rice field */
.field{
    position:absolute;
    bottom:35%;
    width:105px;
    height:70px;
    background:#b6c94b;
    border:5px solid #83a53c;
    transform:skewX(-8deg);
}

.field.f1{left:9%;}
.field.f2{left:27%;}
.field.f3{right:27%;}
.field.f4{right:8%;}

/* Trees */
.tree{
    position:absolute;
    bottom:34%;
    width:30px;
    height:85px;
}

.tree .trunk{
    position:absolute;
    bottom:0;
    left:11px;
    width:9px;
    height:42px;
    background:#75452c;
}

.tree .leaf{
    position:absolute;
    left:-12px;
    top:0;
    width:55px;
    height:55px;
    border-radius:50%;
    background:#2f913b;
    box-shadow:
        18px -10px 0 #3ca344,
        25px 14px 0 #267f34;
}

.tree.t1{left:5%;}
.tree.t2{left:20%;transform:scale(.8);}
.tree.t3{right:17%;transform:scale(1.1);}
.tree.t4{right:5%;transform:scale(.75);}

/* Small village */
.house{
    position:absolute;
    bottom:34%;
    width:85px;
    height:62px;
    background:#d39a61;
    border:4px solid #70452f;
}

.house:before{
    content:"";
    position:absolute;
    left:-9px;
    top:-45px;
    width:95px;
    height:55px;
    background:#a84432;
    clip-path:polygon(50% 0,100% 100%,0 100%);
}

.house:after{
    content:"";
    position:absolute;
    left:34px;
    bottom:0;
    width:20px;
    height:35px;
    background:#65412e;
}

.house.h1{left:43%;}
.house.h2{
    left:55%;
    transform:scale(.8);
}

/* Blocks */
#blocks{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:30%;
}

.block{
    position:absolute;
    width:45px;
    height:45px;
    border:2px solid rgba(0,0,0,.16);
    border-radius:3px;
}

.block.dirt{background:#93613f;}
.block.stone{background:#858585;}
.block.grass{
    background:linear-gradient(
        #62bd43 0 23%,
        #93613f 23% 100%
    );
}
.block.sand{background:#d9c078;}
.block.wood{background:#8a542f;}

/* Player */
#player{
    position:absolute;
    z-index:20;
    width:42px;
    height:70px;
    left:50%;
    bottom:35%;
    transform:translateX(-50%);
}

.head{
    width:38px;
    height:38px;
    margin:auto;
    border-radius:8px;
    background:#e9b47d;
    border:2px solid #824f32;
    position:relative;
}

.head:before,
.head:after{
    content:"";
    position:absolute;
    top:14px;
    width:5px;
    height:5px;
    background:#222;
    border-radius:50%;
}

.head:before{left:8px;}
.head:after{right:8px;}

.body{
    width:31px;
    height:31px;
    margin:-1px auto 0;
    background:#3978c9;
    border-radius:5px 5px 8px 8px;
}

/* Top UI */
#topbar{
    position:absolute;
    z-index:50;
    top:12px;
    left:12px;
    right:12px;
    height:54px;
    padding:0 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-radius:17px;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(10px);
    box-shadow:0 4px 18px rgba(0,0,0,.12);
}

#title{
    font-size:21px;
    font-weight:800;
    color:#24343b;
}

#stats{
    display:flex;
    gap:12px;
    font-size:14px;
    font-weight:bold;
}

/* Controls */
#joystick{
    position:absolute;
    z-index:60;
    left:18px;
    bottom:20px;
    width:115px;
    height:115px;
    border-radius:50%;
    background:rgba(255,255,255,.25);
    border:2px solid rgba(255,255,255,.45);
}

.joyButton{
    position:absolute;
    width:48px;
    height:48px;
    border:0;
    border-radius:50%;
    background:rgba(35,35,35,.68);
    color:#fff;
    font-size:21px;
}

#left{left:4px;top:33px;}
#right{right:4px;top:33px;}
#up{left:33px;top:4px;}
#down{left:33px;bottom:4px;}

#actions{
    position:absolute;
    z-index:60;
    right:18px;
    bottom:20px;
    display:flex;
    gap:10px;
}

.action{
    width:58px;
    height:58px;
    border:0;
    border-radius:18px;
    background:rgba(40,40,40,.75);
    color:white;
    font-size:26px;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.action:active,
.joyButton:active{
    transform:scale(.9);
}

/* Inventory */
#inventory{
    position:absolute;
    z-index:55;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    display:flex;
    gap:6px;
    padding:7px;
    border-radius:15px;
    background:rgba(30,30,30,.7);
}

.slot{
    width:47px;
    height:47px;
    border:2px solid rgba(255,255,255,.25);
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,.1);
    font-size:24px;
}

.slot.selected{
    border-color:white;
}

/* Portrait warning */
#portrait{
    display:none;
    position:absolute;
    z-index:200;
    inset:0;
    background:#20252a;
    color:white;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    font-size:20px;
    font-weight:bold;
}

@media (orientation:portrait){
    #portrait{
        display:flex;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="world">

        <div id="sun"></div>

        <div class="cloud" style="left:12%;top:16%;"></div>
        <div class="cloud" style="left:48%;top:10%;"></div>

        <div class="mountain m1"></div>
        <div class="mountain m2"></div>
        <div class="mountain m3"></div>

        <div id="river"></div>

        <div class="field f1"></div>
        <div class="field f2"></div>
        <div class="field f3"></div>
        <div class="field f4"></div>

        <div class="tree t1">
            <div class="leaf"></div>
            <div class="trunk"></div>
        </div>

        <div class="tree t2">
            <div class="leaf"></div>
            <div class="trunk"></div>
        </div>

        <div class="tree t3">
            <div class="leaf"></div>
            <div class="trunk"></div>
        </div>

        <div class="tree t4">
            <div class="leaf"></div>
            <div class="trunk"></div>
        </div>

        <div class="house h1"></div>
        <div class="house h2"></div>

        <div id="ground"></div>

        <div id="blocks">
            <div class="block grass" style="left:0;bottom:0;"></div>
            <div class="block grass" style="left:45px;bottom:0;"></div>
            <div class="block grass" style="left:90px;bottom:0;"></div>
            <div class="block grass" style="left:135px;bottom:0;"></div>

            <div class="block stone" style="left:10%;bottom:45px;"></div>
            <div class="block stone" style="left:calc(10% + 45px);bottom:45px;"></div>

            <div class="block sand" style="right:18%;bottom:45px;"></div>
            <div class="block wood" style="right:calc(18% + 45px);bottom:45px;"></div>
        </div>

        <div id="player">
            <div class="head"></div>
            <div class="body"></div>
        </div>

    </div>

    <div id="topbar">
        <div id="title">⛏️ MINE</div>
        <div id="stats">
            <span>❤️ 100</span>
            <span>☀️ Day</span>
        </div>
    </div>

    <div id="joystick">
        <button class="joyButton" id="left">◀</button>
        <button class="joyButton" id="right">▶</button>
        <button class="joyButton" id="up">▲</button>
        <button class="joyButton" id="down">▼</button>
    </div>

    <div id="inventory">
        <div class="slot selected">🟫</div>
        <div class="slot">🪨</div>
        <div class="slot">🪵</div>
        <div class="slot">🟨</div>
    </div>

    <div id="actions">
        <button class="action">⛏️</button>
        <button class="action">🧱</button>
    </div>

    <div id="portrait">
        📱<br><br>
        សូមបង្វិលទូរសព្ទផ្ដេក<br>
        ដើម្បីលេង Mine
    </div>

</div>

<script>
const player = document.getElementById("player");

let x = 50;
let y = 35;

function updatePlayer(){
    player.style.left = x + "%";
    player.style.bottom = y + "%";
}

function moveLeft(){
    x = Math.max(3,x-2);
    updatePlayer();
}

function moveRight(){
    x = Math.min(97,x+2);
    updatePlayer();
}

function jump(){
    player.style.bottom = (y+8) + "%";

    setTimeout(()=>{
        player.style.bottom = y + "%";
    },300);
}

document.getElementById("left").addEventListener("click",moveLeft);
document.getElementById("right").addEventListener("click",moveRight);
document.getElementById("up").addEventListener("click",jump);

document.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft" || e.key==="a") moveLeft();
    if(e.key==="ArrowRight" || e.key==="d") moveRight();
    if(e.key==="ArrowUp" || e.key===" ") jump();
});

updatePlayer();
</script>

</body>
</html>
